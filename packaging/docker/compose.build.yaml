# Maintainers only: build the images used by compose.yaml; never publish them.
x-build: &build
  context: ../..
  network: ${PAPER_MANAGER_BUILD_NETWORK:-default}
  args:
    VCS_REF: ${PAPER_MANAGER_REVISION:-unknown}
    VERSION: ${PAPER_MANAGER_VERSION:-1.0.1}
    HTTP_PROXY: ${HTTP_PROXY:-${ALL_PROXY:-}}
    HTTPS_PROXY: ${HTTPS_PROXY:-${ALL_PROXY:-}}
    NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}

services:
  api:
    build:
      <<: *build
      dockerfile: Dockerfile
  parser:
    build:
      <<: *build
      dockerfile: pdf_parser/Dockerfile
  web:
    build:
      <<: *build
      dockerfile: web/Dockerfile
