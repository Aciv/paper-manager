name: Desktop platform bundle and validation

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string

permissions:
  contents: read

# Each platform owns its build dependency so another platform cannot skip its
# artifact validation. Keep validation on a fresh runner without a checkout.
jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native build tools (not runtime dependencies)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bison flex
      - name: Install validation dependencies
        run: >-
          python -m pip install --only-binary=:all: -r packaging/desktop/requirements-validation.txt
      - name: Desktop packaging and native runtime tests
        shell: bash
        run: ./scripts/desktop/run_tests.sh
      - name: Windows validation wrapper regression
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/desktop/test_windows_desktop_harness.ps1
      - name: Build sealed hybrid-profile bundle
        # Exact archives and wheels are SHA-256 verified; no developer venv,
        # global database install, or post-install pip downloads are used.
        run: >-
          python scripts/desktop/build_desktop_bundle.py --profile hybrid
          --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/desktop-bundle"
          --cache "$RUNNER_TEMP/desktop-downloads"
      - name: Build guarded synthetic migration failure tool
        run: >-
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/upgrade-failure" ./scripts/desktop/upgrade-failure
      - name: Archive internal validation delivery (not the user package)
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          suffix = 'zip' if os.name == 'nt' else 'tar.gz'
          subprocess.run([sys.executable, 'scripts/desktop/package_desktop_bundle.py',
                          '--audience', 'validation',
                          '--bundle', str(root / 'desktop-bundle'),
                          '--output', str(root / ('desktop.' + suffix)),
                          '--failure-probe', str(root / 'upgrade-failure')], check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: internal-desktop-${{ inputs.runner }}
          path: ${{ runner.temp }}/desktop.*
          if-no-files-found: error
          retention-days: 1
      - name: Export and verify the minimal user package from the same build
        shell: python
        run: |
          import json, os, pathlib, subprocess, sys
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          bundle = root / 'desktop-bundle'
          manifest = json.loads((bundle / 'bundle.json').read_text(encoding='utf-8'))
          suffix = 'zip' if os.name == 'nt' else 'tar.gz'
          version = manifest['application']['version']
          target = manifest['target']
          archive = root / 'user-package' / f'paper_manager-{version}-{target}.{suffix}'
          subprocess.run([sys.executable, 'scripts/desktop/package_desktop_bundle.py',
                          '--bundle', str(bundle), '--output', str(archive)], check=True)
          subprocess.run([sys.executable, 'scripts/desktop/check_desktop_package.py',
                          '--archive', str(archive), '--verify-only'], check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: paper_manager-${{ inputs.runner }}
          path: ${{ runner.temp }}/user-package/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7


  artifact-test:
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    needs: build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      # Deliberately no checkout, no setup-go/node/PostgreSQL/Redis, and no
      # parser wheels installed on this clean job. Test orchestration uses
      # psutil, while the app's controlled PATH has no installed developer tools.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install psutil==7.0.0 grpcio==1.82.1 protobuf==7.35.1
      - uses: actions/download-artifact@v4
        with:
          name: internal-desktop-${{ inputs.runner }}
          path: ${{ runner.temp }}/download
      - name: Extract into supported ASCII path
        shell: python
        run: |
          import hashlib, os, pathlib, subprocess, sys, tarfile, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          sources = [root / 'download' / name for name in ('desktop.zip', 'desktop.tar.gz')]
          sources = [path for path in sources if path.is_file()]
          if len(sources) != 1:
              raise ValueError('Expected one platform archive')
          source = sources[0]
          with source.open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          expected = digest + '  ' + source.name + chr(10)
          if source.with_name(source.name + '.sha256').read_text(encoding='utf-8') != expected:
              raise ValueError('Downloaded archive checksum differs')
          destination = root / 'pm-bundle'
          if zipfile.is_zipfile(source):
              with zipfile.ZipFile(source) as archive:
                  archive.extractall(destination)
          else:
              with tarfile.open(source) as archive:
                  archive.extractall(destination, filter='data')
          subprocess.run([sys.executable, '-B', str(destination / 'validation/check_desktop_package.py'),
                          '--directory', str(destination), '--verify-only'], check=True)
      - name: Exercise only the downloaded bundle
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          python "$RUNNER_TEMP/pm-bundle/validation/check_desktop_launcher.py"
          --bundle "$RUNNER_TEMP/pm-bundle/bundle"
          --output-dir "$RUNNER_TEMP/desktop-results"
      - name: Exercise bundle as an ordinary Windows user
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/pm-bundle/validation/check_windows_desktop_user.ps1" `
            -Bundle "$env:RUNNER_TEMP/pm-bundle/bundle" `
            -Harness "$env:RUNNER_TEMP/pm-bundle/validation" `
            -OutputDirectory "$env:RUNNER_TEMP/desktop-results" -Upgrade
      - name: Exercise installed upgrades and real migration rollback
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          python "$RUNNER_TEMP/pm-bundle/validation/check_desktop_upgrade.py"
          --bundle "$RUNNER_TEMP/pm-bundle/bundle"
          --output-dir "$RUNNER_TEMP/desktop-results/upgrade"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: internal-desktop-results-${{ inputs.runner }}
          path: ${{ runner.temp }}/desktop-results
          if-no-files-found: warn
          retention-days: 7
