# Air runs the host-side API in the hybrid development workflow. Docker keeps
# PostgreSQL, Redis, and the Python parser alive, so source edits need only a
# quick Go rebuild/restart.
root = "."
tmp_dir = "tmp/air"

[build]
  cmd = "go build -o ./tmp/air/papers-manager ./cmd/server"
  bin = "./tmp/air/papers-manager"
  delay = 750
  include_ext = ["go"]
  exclude_dir = [".git", "data", "Logs", "model_train", "python", "tmp", "web"]
  exclude_regex = ["_test\\.go$"]
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
