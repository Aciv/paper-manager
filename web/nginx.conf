server {
    listen 80;
    server_name _;
    # The Go API accepts one batch request up to 500 MiB
    # (internal/handler/document.go). Keep nginx slightly above that so the
    # API can return its structured limit error instead of nginx's HTML 413.
    client_max_body_size 501m;

    # PDF.js worker is an ES module. Alpine's stock mime.types omits .mjs,
    # causing Firefox to reject it as application/octet-stream. A dedicated
    # location avoids replacing the MIME table used by index.html and CSS.
    location ~ \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Batch uploads and synchronous URL imports can exceed nginx's 60s
        # default; the API itself enforces the real work timeouts.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
