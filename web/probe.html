<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>PDF citation-link probe</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.5 system-ui, sans-serif; background: #f4f5f7; }
  header { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: #222; color: #eee; position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
  header input[type=text] { width: 300px; font: inherit; padding: 3px 6px; }
  header button { font: inherit; padding: 3px 10px; }
  header label { color: #9cf; }
  #stats { font-size: 12px; color: #ffd; margin-left: 6px; }
  .hint { color: #aaa; font-size: 11px; margin-left: 8px; }
  main { display: grid; grid-template-columns: 380px 1fr; gap: 10px; padding: 10px; align-items: start; }
  #list { background: #fff; border: 1px solid #ccc; max-height: calc(100vh - 90px); overflow: auto; }
  #list h2 { margin: 0; font-size: 12px; padding: 6px 8px; background: #eef; position: sticky; top: 0; }
  .row { border-bottom: 1px solid #eee; padding: 4px 8px; cursor: pointer; }
  .row:hover, .row.active { background: #ddf; }
  .row .arrow { color: #c33; font-weight: bold; }
  .row .dest { color: #06c; }
  .row .meta { color: #888; font-size: 11px; }
  .row .block { color: #080; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pages { background: #999; padding: 10px; max-height: calc(100vh - 90px); overflow: auto; }
  .pw { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.35); margin: 0 auto 14px; width: 800px; }
  .pw .phead { font-size: 11px; color: #666; padding: 2px 8px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; }
  .pw .canvas-holder { position: relative; }
  .pw canvas { display: block; width: 100%; }
  .pw .ann { position: absolute; border: 1px solid rgba(200, 40, 40, .9); background: rgba(255, 60, 60, .12); cursor: pointer; }
  .pw .ann:hover, .pw .ann.active { background: rgba(255, 60, 60, .45); }
  .pw .target { position: absolute; border: 2px solid #06f; background: rgba(0, 100, 255, .18); pointer-events: none; z-index: 3; }
  .pw .target.flash { animation: pulse 0.9s ease 2; }
  @keyframes pulse { 50% { background: rgba(255, 220, 0, .55); } }
  .pw .blockrect { position: absolute; border: 1px dashed #0a0; pointer-events: none; z-index: 2; }
  #log { font: 11px/1.5 ui-monospace, monospace; background: #111; color: #9f9; margin: 0; padding: 6px 8px; }
</style>
</head>
<body>
<header>
  <input id="file" type="file" accept="application/pdf" />
  <button id="fileBtn">用本地 PDF(无需后端)</button>
  <button id="sampleBtn">内置样例 PDF(零依赖)</button>
  <button id="realBtn">真实论文 .example(打开页面即自动加载)</button>
  <span>或</span>
  <input id="docid" type="text" placeholder="document id(经 /api 拉取 + 对拍 blocks)" />
  <button id="docBtn">加载 doc</button>
  <button id="jsonBtn" disabled>复制 JSON</button>
  <span id="stats"></span>
</header>
<main>
  <section id="list"><h2>引用链接(点行 → 跳到目标页)</h2></section>
  <section id="right">
    <div id="pages"></div>
    <pre id="log"></pre>
  </section>
</main>
<script type="module" src="/probe.ts"></script>
</body>
</html>
