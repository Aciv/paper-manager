syntax = "proto3";
package papers.v1;
option go_package = "paperMaster/gen/papers/v1;papersv1";

// Python parses one source and returns normalized Markdown. The Go application
// owns document status, database writes, and durable output storage.
service DocumentParser {
  rpc Recognize(RecognitionRequest) returns (RecognitionResult);
}

// PaperMetadataExtractor derives candidates from an already-persisted
// Markdown revision. It performs no catalog lookups and writes no database
// state; Go remains responsible for orchestration and canonical persistence.

service PaperMetadataExtractor {
  rpc Extract(PaperExtractionRequest) returns (PaperExtractionResult);
}
message RecognitionRequest {
  string document_id = 1;
  string filename = 2;
  string content_type = 3;
  oneof source {
    bytes content = 4;
    string file_path = 5;
    string source_url = 6;
  }
}

message RecognitionResult {
  bytes markdown = 1;
  string markdown_filename = 2;
  string content_type = 3;
  int64 size_bytes = 4;
  string language = 6;
  int32 page_count = 7;
  string parser_name = 8;
  string parser_version = 9;
  repeated RecognitionBlock blocks = 10;
  RecognitionOutline outline = 11;
  reserved 15;
}

// RecognitionOutline is the bounded source hierarchy selected during the
// same parser generation as markdown and blocks. Integer ranges are half-open;
// -1 means unavailable for an unmapped item. parent_ordinal uses -1 for roots.
message RecognitionOutline {
  int32 schema_version = 1;
  string source = 2;
  repeated RecognitionOutlineSection sections = 3;
  repeated string diagnostics = 4;
}

message RecognitionOutlineSection {
  reserved 15;
  reserved "mapping_quality";
  int32 ordinal = 1;
  string title = 2;
  int32 level = 3;
  int32 parent_ordinal = 4;
  int32 start_page = 5;
  double start_x = 6;
  double start_y = 7;
  int32 end_page = 8;
  double end_x = 9;
  double end_y = 10;
  int32 start_block_ordinal = 11;
  int32 end_block_ordinal = 12;
  int32 markdown_codepoint_start = 13;
  int32 markdown_codepoint_end = 14;
}

// A block maps a semantic Markdown fragment to one rectangular PDF region.
// Coordinates use the PyMuPDF top-left page coordinate system in PDF points.
message RecognitionBlock {
  int32 ordinal = 1;
  string type = 2;
  string text = 3;
  int32 page_number = 4;
  double page_width = 5;
  double page_height = 6;
  double bbox_x0 = 7;
  double bbox_y0 = 8;
  double bbox_x1 = 9;
  double bbox_y1 = 10;
  int32 markdown_codepoint_start = 11;
  int32 markdown_codepoint_end = 12;
  // PNG crop for image/table blocks only. It is transport data, never a
  // public URL; the Go API stores it and exposes a protected block endpoint.
  bytes image_data = 13;
  string image_content_type = 14;
}

message PaperExtractionRequest {
  string document_id = 1;
  bytes markdown = 3;
  // Compact source-map data only: no database IDs, URLs, or image bytes cross
  // this RPC. The source storage key is a Go-created, relative key beneath the
  // parser's shared upload root; Python uses it only to derive temporary
  // layout facts from the original PDF.
  repeated PaperSourceBlock blocks = 4;
  reserved 5;
  string source_storage_key = 6;
}

message PaperSourceBlock {
  int32 ordinal = 1;
  string type = 2;
  string text = 3;
  PaperSourceLocation location = 4;
}

message PaperSourceLocation {
  int32 page_number = 1;
  double page_width = 2;
  double page_height = 3;
  double bbox_x0 = 4;
  double bbox_y0 = 5;
  double bbox_x1 = 6;
  double bbox_y1 = 7;
  int32 markdown_codepoint_start = 8;
  int32 markdown_codepoint_end = 9;
}

message PaperExtractionResult {
  PaperTextCandidate title = 1;
  repeated PaperTextCandidate authors = 2;
  PaperTextCandidate abstract = 3;
  // References stay as raw extraction strings. Go resolves them through
  // external paper catalogs in a later task.
  repeated string references = 4;
  string extractor_name = 5;
  string extractor_version = 6;
  // Additive structured interpretation of a raw reference. `references`
  // remains the compatibility source of truth for the original strings.
  repeated PaperReferenceCandidate reference_candidates = 7;
  // True only when the extractor positively located a bibliography region.
  // Empty references with false means unavailable/undetected, not "clear all".
  bool references_detected = 8;
}

// PaperReferenceCandidate contains optional fields parsed from one exact raw
// bibliography entry. It performs no catalog lookup and may be partial.
message PaperReferenceCandidate {
  string raw_reference = 1;
  repeated string authors = 2;
  string title = 3;
  string venue = 4;
  int32 published_year = 5;
  string doi = 6;
  string arxiv_id = 7;
  string volume = 8;
  string pages = 9;
  double confidence = 10;
}

message PaperTextCandidate {
  string value = 1;
  double confidence = 2;
  repeated PaperSourceEvidence evidence = 3;
}

message PaperSourceEvidence {
  int32 block_ordinal = 1;
  int32 page_number = 2;
  int32 markdown_codepoint_start = 3;
  int32 markdown_codepoint_end = 4;
}
