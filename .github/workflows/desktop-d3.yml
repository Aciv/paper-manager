name: Desktop internal bundle (D3)

on:
  workflow_dispatch:
  push:
    branches: [codex_main]
    paths:
      - '.github/workflows/desktop-d3.yml'
      - 'cmd/**'
      - 'internal/runtime/**'
      - 'scripts/*desktop*'
      - 'packaging/desktop/**'
      - 'pdf_parser/**'
      - 'web/**'
  pull_request:
    paths:
      - '.github/workflows/desktop-d3.yml'
      - 'cmd/launcher/**'
      - 'internal/runtime/desktop/**'
      - 'scripts/*desktop*'
      - 'packaging/desktop/**'

permissions:
  contents: read

# No public release action. All artifacts are private validation candidates,
# with short retention. Production CRF weights are never uploaded implicitly.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, windows-2022, macos-14]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native build tools (not runtime dependencies)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bison flex
      - name: Bundle helper tests
        run: python -m unittest discover -s scripts -p test_desktop_bundle.py
      - name: Build sealed rules-profile bundle
        # Exact archives and wheels are SHA-256 verified; no developer venv,
        # global database install, or post-install pip downloads are used.
        run: >-
          python scripts/build_desktop_bundle.py --profile rules
          --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/desktop-bundle"
          --cache "$RUNNER_TEMP/desktop-downloads"
      - name: Archive bundle and standalone validation harness
        shell: python
        run: |
          import os, pathlib, tarfile
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          with tarfile.open(root / 'desktop.tar.gz', 'w:gz') as archive:
              archive.add(root / 'desktop-bundle', arcname='bundle')
              for name in ('check_desktop_launcher.py', 'desktop_bundle.py', 'check_windows_desktop_user.ps1'):
                  archive.add(pathlib.Path('scripts') / name, arcname='validation/' + name)
      - uses: actions/upload-artifact@v4
        with:
          name: internal-desktop-${{ matrix.runner }}
          path: ${{ runner.temp }}/desktop.tar.gz
          if-no-files-found: error
          retention-days: 1

  artifact-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, windows-2022, macos-14]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      # Deliberately no checkout, no setup-go/node/PostgreSQL/Redis, and no
      # parser wheels installed on this clean job. Test orchestration uses
      # psutil, while the app's controlled PATH has no installed developer tools.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install psutil==7.0.0
      - uses: actions/download-artifact@v4
        with:
          name: internal-desktop-${{ matrix.runner }}
          path: ${{ runner.temp }}/download
      - name: Extract into relocated Unicode path
        shell: python
        run: |
          import os, pathlib, tarfile
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          destination = root / 'pm bundle 阅读'
          with tarfile.open(root / 'download/desktop.tar.gz') as archive:
              archive.extractall(destination, filter='data')
      - name: Exercise only the downloaded bundle
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          python "$RUNNER_TEMP/pm bundle 阅读/validation/check_desktop_launcher.py"
          --bundle "$RUNNER_TEMP/pm bundle 阅读/bundle"
          --output-dir "$RUNNER_TEMP/desktop-results"
      - name: Exercise bundle as an ordinary Windows user
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/pm bundle 阅读/validation/check_windows_desktop_user.ps1" `
            -Bundle "$env:RUNNER_TEMP/pm bundle 阅读/bundle" `
            -Harness "$env:RUNNER_TEMP/pm bundle 阅读/validation" `
            -OutputDirectory "$env:RUNNER_TEMP/desktop-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: internal-desktop-results-${{ matrix.runner }}
          path: ${{ runner.temp }}/desktop-results
          if-no-files-found: warn
          retention-days: 7
