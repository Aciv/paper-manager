name: Desktop internal bundle (D3)

on:
  # Explicit operator-created validation tags only. Ordinary pushes/PRs do
  # not launch this matrix; this also works before the workflow reaches main.
  push:
    tags:
      - 'validation/d4-*'
  workflow_call:
    inputs:
      target:
        type: string
        default: windows-crf
  workflow_dispatch:
    inputs:
      target:
        description: 'Run only the selected target; full matrix is for final acceptance'
        required: true
        default: windows-crf
        type: choice
        options:
          - windows-crf
          - ubuntu-22.04
          - windows-2022
          - macos-14
          - all

permissions:
  contents: read

concurrency:
  group: desktop-internal-${{ github.ref }}
  cancel-in-progress: true

# No public release action. All artifacts are private validation candidates,
# with short retention. Only explicitly authorized small CRF weights are committed.
jobs:
  windows-crf-path:
    if: inputs.target == 'windows-crf'
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: python-crfsuite==0.9.12
      - name: Native Unicode CRF model loading and unchanged predictions
        working-directory: pdf_parser
        run: python -m unittest discover -s papers_parser -p test_native_crf_runtime.py

  build:
    if: inputs.target != 'windows-crf'
    strategy:
      fail-fast: false
      matrix:
        runner: >-
          ${{ fromJSON(startsWith(github.ref, 'refs/tags/validation/d4-windows-')
            && '["windows-2022"]'
            || ((github.event_name == 'push' || inputs.target == 'all')
            && '["ubuntu-22.04","windows-2022","macos-14"]'
            || format('["{0}"]', inputs.target))) }}
    uses: ./.github/workflows/desktop-platform.yml
    with:
      runner: ${{ matrix.runner }}
