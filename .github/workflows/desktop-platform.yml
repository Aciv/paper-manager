name: Native user-package tests

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record exact source revision
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Source: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Install native build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bison flex
      - name: Install validation dependencies outside the runtime
        run: >-
          python -m pip install --only-binary=:all:
          -r packaging/desktop/requirements-validation.txt
      - name: Packaging, URL import helpers and Go tests
        run: |
          ./scripts/desktop/run_tests.sh --python-only
          node --experimental-strip-types --test web/tests/urlImports.test.ts
          go test ./...
      - name: Windows ordinary-account wrapper regression
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/desktop/test_windows_desktop_harness.ps1
      - name: Build one sealed hybrid runtime
        run: >-
          python scripts/desktop/build_desktop_bundle.py --profile hybrid
          --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/desktop-bundle"
          --cache "$RUNNER_TEMP/desktop-downloads"
      - name: Real Windows uninstall entry regression
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE/scripts/desktop;$env:GITHUB_WORKSPACE/scripts/desktop/tests"
          $env:PAPERS_MANAGER_TEST_LAUNCHER = "$env:RUNNER_TEMP/desktop-bundle/launcher.exe"
          python -B -m unittest test_windows_entry.WindowsUninstallEntryTests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile Windows PostgreSQL recovery test for ordinary-account validation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go test -c ./internal/runtime/desktop -o "$env:RUNNER_TEMP/desktop-recovery.test.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Frontend tests (reuse build dependencies)
        run: ./scripts/tests/web.sh
      - name: Python tests with the bundled interpreter
        shell: python
        env:
          PARSER_LAYOUT_THREADS: '2'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          import os, pathlib, subprocess, sys
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          site = root / 'validation-site'
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--only-binary=:all:',
                          '--target', str(site), 'psutil==7.0.0'], check=True)
          python = root / 'desktop-bundle/python' / ('python.exe' if os.name == 'nt' else 'bin/python3')
          env = {**os.environ, 'PYTHONPATH': str(site), 'PYTHONDONTWRITEBYTECODE': '1'}
          subprocess.run([str(python), '-B', '-m', 'unittest', 'discover',
                          '-s', 'papers_parser/test', '-p', 'test_*.py'],
                         cwd='pdf_parser', env=env, check=True)
      - name: Export minimal user archive and separate validation tools
        shell: python
        run: |
          import json, os, pathlib, shutil, subprocess, sys
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          bundle = root / 'desktop-bundle'
          manifest = json.loads((bundle / 'bundle.json').read_text(encoding='utf-8'))
          if manifest['revision'] != os.environ['GITHUB_SHA']:
              raise ValueError('Runtime revision differs from checked-out source')
          suffix = 'zip' if os.name == 'nt' else 'tar.gz'
          version, target = manifest['application']['version'], manifest['target']
          archive = root / 'candidate' / f'paper_manager-{version}-{target}.{suffix}'
          subprocess.run([sys.executable, 'scripts/desktop/package_desktop_bundle.py',
                          '--bundle', str(bundle), '--output', str(archive)], check=True)
          subprocess.run([sys.executable, 'scripts/desktop/check_desktop_package.py',
                          '--archive', str(archive), '--verify-only'], check=True)
          tools = root / 'validation-tools'
          tools.mkdir()
          for name in ['desktop_bundle.py', 'check_desktop_package.py', 'check_desktop_launcher.py',
                       'check_desktop_setup_failures.py', 'check_windows_desktop_user.ps1',
                       'check_user_uninstall.py', 'benchmark_parser_shared.py']:
              source = pathlib.Path('scripts/desktop') / name
              if not source.is_file():
                  source = pathlib.Path('scripts/parser') / name
              shutil.copy2(source, tools / name)
          if os.name == 'nt':
              shutil.copy2(root / 'desktop-recovery.test.exe', tools / 'desktop-recovery.test.exe')
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ inputs.runner }}
          path: ${{ runner.temp }}/candidate/*
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: validation-tools-${{ inputs.runner }}
          path: ${{ runner.temp }}/validation-tools
          retention-days: 1

  native-test:
    needs: build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      # No application checkout, Go/Node installation or global database.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install psutil==7.0.0 grpcio==1.82.1 protobuf==7.35.1
      - uses: actions/download-artifact@v4
        with:
          name: candidate-${{ inputs.runner }}
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@v4
        with:
          name: validation-tools-${{ inputs.runner }}
          path: ${{ runner.temp }}/validation-tools
      - name: Extract and verify the actual user package into an ASCII directory
        shell: python
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          import json, os, pathlib, sys
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          sys.path.insert(0, str(root / 'validation-tools'))
          from desktop_bundle import extract
          from check_desktop_package import verify_checksum, verify_delivery
          records = list((root / 'candidate').glob('*.manifest.json'))
          if len(records) != 1:
              raise ValueError('Expected exactly one user archive manifest')
          record = records[0]
          archive = record.with_name(record.name.removesuffix('.manifest.json'))
          verify_checksum(archive)
          destination = root / 'pm-user'
          extract(archive, destination)
          metadata = verify_delivery(destination, record)
          if metadata['revision'] != os.environ['EXPECTED_SHA']:
              raise ValueError('Downloaded archive has a stale source revision')
      - name: Exercise user package as an ordinary Windows account
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/validation-tools/check_windows_desktop_user.ps1" `
            -Bundle "$env:RUNNER_TEMP/pm-user/bundle" `
            -Harness "$env:RUNNER_TEMP/validation-tools" `
            -OutputDirectory "$env:RUNNER_TEMP/desktop-results" -UserUninstall `
            -PostgresRecoveryTest "$env:RUNNER_TEMP/validation-tools/desktop-recovery.test.exe"
      - name: Exercise user package on Unix
        if: runner.os != 'Windows'
        run: |
          python "$RUNNER_TEMP/validation-tools/check_desktop_launcher.py" \
            --bundle "$RUNNER_TEMP/pm-user/bundle" --output-dir "$RUNNER_TEMP/desktop-results"
          python "$RUNNER_TEMP/validation-tools/check_user_uninstall.py" \
            --delivery "$RUNNER_TEMP/pm-user" --output-dir "$RUNNER_TEMP/desktop-results/uninstall"
      - name: User downloads (uploaded only after native tests succeed)
        uses: actions/upload-artifact@v4
        with:
          name: paper_manager-${{ inputs.runner }}
          path: ${{ runner.temp }}/candidate/*
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ inputs.runner }}
          path: ${{ runner.temp }}/desktop-results
          if-no-files-found: warn
          retention-days: 7
