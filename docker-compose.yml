


services:
  upload-permissions:
    image: alpine:3.20
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /data/uploads /data/recognition-output && chown -R 10001:10001 /data/uploads /data/recognition-output && chmod 0750 /data/uploads /data/recognition-output"]
    volumes:
      - ./data/uploads:/data/uploads
      - ./data/recognition-output:/data/recognition-output

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: papers
      POSTGRES_PASSWORD: papers
      POSTGRES_DB: papers
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papers -d papers"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  parser:
    build:
      context: .
      dockerfile: python/Dockerfile
    environment:
      UPLOAD_DIR: /data/uploads
      RECOGNITION_OUTPUT_DIR: /data/recognition-output
      PARSER_GRPC_ADDR: 0.0.0.0:50051
      PARSER_MAX_FILE_SIZE: 104857600
      PARSER_GRPC_MAX_MESSAGE_SIZE: 105906176
      PARSER_IMAGE_DPI: 72
      PARSER_MAX_EXTRACTION_MARKDOWN_BYTES: ${PARSER_MAX_EXTRACTION_MARKDOWN_BYTES:-33554432}
      PARSER_MAX_EXTRACTION_BLOCKS: ${PARSER_MAX_EXTRACTION_BLOCKS:-50000}
    volumes:
      - ./data/uploads:/data/uploads:ro
      - ./data/recognition-output:/data/recognition-output
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      upload-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1', 50051), 2).close()\""]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      DATABASE_URL: postgres://papers:papers@postgres:5432/papers?sslmode=disable
      UPLOAD_DIR: /data/uploads

      RECOGNITION_OUTPUT_DIR: /data/recognition-output
      HTTP_ADDR: :8080
      PARSER_GRPC_ADDR: parser:50051

      DOCUMENT_RECOGNITION_DRIVER: builtin
      REDIS_ADDR: redis:6379
      CORS_ORIGIN: http://localhost:5173
      PAPER_CATALOG_PROVIDERS: ${PAPER_CATALOG_PROVIDERS:-arxiv,semantic_scholar,openalex,crossref}
      PAPER_CATALOG_TIMEOUT: ${PAPER_CATALOG_TIMEOUT:-10s}
      PAPER_CATALOG_CONCURRENCY: ${PAPER_CATALOG_CONCURRENCY:-4}
      PAPER_CATALOG_ARXIV_TIMEOUT: ${PAPER_CATALOG_ARXIV_TIMEOUT:-20s}
      PAPER_CATALOG_ARXIV_SPACING: ${PAPER_CATALOG_ARXIV_SPACING:-3s}
      PAPER_CATALOG_ARXIV_CONCURRENCY: ${PAPER_CATALOG_ARXIV_CONCURRENCY:-1}
      PAPER_CATALOG_SEMANTIC_SCHOLAR_TIMEOUT: ${PAPER_CATALOG_SEMANTIC_SCHOLAR_TIMEOUT:-10s}
      PAPER_CATALOG_SEMANTIC_SCHOLAR_SPACING: ${PAPER_CATALOG_SEMANTIC_SCHOLAR_SPACING:-1s}
      PAPER_CATALOG_SEMANTIC_SCHOLAR_CONCURRENCY: ${PAPER_CATALOG_SEMANTIC_SCHOLAR_CONCURRENCY:-1}
      PAPER_CATALOG_OPENALEX_TIMEOUT: ${PAPER_CATALOG_OPENALEX_TIMEOUT:-10s}
      PAPER_CATALOG_OPENALEX_SPACING: ${PAPER_CATALOG_OPENALEX_SPACING:-1s}
      PAPER_CATALOG_OPENALEX_CONCURRENCY: ${PAPER_CATALOG_OPENALEX_CONCURRENCY:-1}
      PAPER_CATALOG_CROSSREF_TIMEOUT: ${PAPER_CATALOG_CROSSREF_TIMEOUT:-10s}
      PAPER_CATALOG_CROSSREF_SPACING: ${PAPER_CATALOG_CROSSREF_SPACING:-500ms}
      PAPER_CATALOG_CROSSREF_CONCURRENCY: ${PAPER_CATALOG_CROSSREF_CONCURRENCY:-1}
      PAPER_REFERENCE_CATALOG_MAX_PER_DOCUMENT: ${PAPER_REFERENCE_CATALOG_MAX_PER_DOCUMENT:-25}
      PAPER_REFERENCE_CATALOG_CONCURRENCY: ${PAPER_REFERENCE_CATALOG_CONCURRENCY:-2}
      PAPER_REFERENCE_CATALOG_PER_DOCUMENT_CONCURRENCY: ${PAPER_REFERENCE_CATALOG_PER_DOCUMENT_CONCURRENCY:-1}
      PAPER_CATALOG_USER_AGENT: ${PAPER_CATALOG_USER_AGENT:-papersManager/1.0}
      PAPER_EXTRACTION_TASK_TIMEOUT: ${PAPER_EXTRACTION_TASK_TIMEOUT:-2m}
      PAPER_EXTRACTION_TASK_MAX_RETRY: ${PAPER_EXTRACTION_TASK_MAX_RETRY:-3}
      PAPER_CATALOG_TASK_TIMEOUT: ${PAPER_CATALOG_TASK_TIMEOUT:-10m}
      PAPER_CATALOG_TASK_MAX_RETRY: ${PAPER_CATALOG_TASK_MAX_RETRY:-5}
      REMOTE_PDF_DOWNLOAD_TIMEOUT: ${REMOTE_PDF_DOWNLOAD_TIMEOUT:-2m}
      REMOTE_PDF_MAX_REDIRECTS: ${REMOTE_PDF_MAX_REDIRECTS:-5}
      REMOTE_PDF_TASK_TIMEOUT: ${REMOTE_PDF_TASK_TIMEOUT:-5m}
      REMOTE_PDF_TASK_MAX_RETRY: ${REMOTE_PDF_TASK_MAX_RETRY:-4}
      REMOTE_PDF_DOWNLOAD_CONCURRENCY: ${REMOTE_PDF_DOWNLOAD_CONCURRENCY:-2}
      REMOTE_PDF_HOST_CONCURRENCY: ${REMOTE_PDF_HOST_CONCURRENCY:-1}
      REMOTE_PDF_HOST_SPACING: ${REMOTE_PDF_HOST_SPACING:-1s}
      REMOTE_PDF_DISPATCH_LIMIT: ${REMOTE_PDF_DISPATCH_LIMIT:-100}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      CROSSREF_MAILTO: ${CROSSREF_MAILTO:-}
    volumes:
      - ./data/uploads:/data/uploads
      - ./data/recognition-output:/data/recognition-output
    depends_on:
      postgres:
        condition: service_healthy
      parser:
        condition: service_healthy

      redis:
        condition: service_healthy
      upload-permissions:
        condition: service_completed_successfully
    ports:
      - "${API_HOST_PORT:-8080}:8080"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on:
      - api
    ports:
      - "${WEB_HOST_PORT:-5173}:80"
volumes:
  postgres-data:
  redis-data:
