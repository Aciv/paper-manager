
services:
  upload-permissions:
    image: alpine:3.20
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /data/uploads /data/recognition-output /data/api-tmp && chown -R 10001:10001 /data/uploads /data/recognition-output && chmod 0750 /data/uploads /data/recognition-output && chmod 0700 /data/api-tmp"]
    volumes:
      - ./data/uploads:/data/uploads
      - ./data/recognition-output:/data/recognition-output
      - ./data/api-tmp:/data/api-tmp

  postgres:
    image: postgres:17-alpine
    mem_limit: ${POSTGRES_MEM_LIMIT:-768m}
    memswap_limit: ${POSTGRES_MEM_LIMIT:-768m}
    environment:
      POSTGRES_USER: papers
      POSTGRES_PASSWORD: papers
      POSTGRES_DB: papers
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papers -d papers"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    memswap_limit: ${REDIS_MEM_LIMIT:-256m}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  parser:
    build:
      context: .
      dockerfile: pdf_parser/Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-${ALL_PROXY:-}}
        HTTPS_PROXY: ${HTTPS_PROXY:-${ALL_PROXY:-}}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    environment:
      UPLOAD_DIR: /data/uploads
      RECOGNITION_OUTPUT_DIR: /data/recognition-output
      PARSER_GRPC_ADDR: 0.0.0.0:50051
      PARSER_MAX_FILE_SIZE: 104857600
      PARSER_GRPC_MAX_MESSAGE_SIZE: 105906176
      PARSER_IMAGE_DPI: ${PARSER_IMAGE_DPI:-144}
      PARSER_MAX_IMAGE_DPI: ${PARSER_MAX_IMAGE_DPI:-300}
      PARSER_MAX_PAGES: ${PARSER_MAX_PAGES:-2000}
      PARSER_MAX_PAGE_EDGE_POINTS: ${PARSER_MAX_PAGE_EDGE_POINTS:-5000}
      PARSER_MAX_CROP_PIXELS: ${PARSER_MAX_CROP_PIXELS:-20000000}
      PARSER_MAX_CROPS_PER_DOCUMENT: ${PARSER_MAX_CROPS_PER_DOCUMENT:-500}
      PARSER_MAX_CROP_BYTES: ${PARSER_MAX_CROP_BYTES:-50331648}
      PARSER_MAX_RECOGNITION_MARKDOWN_BYTES: ${PARSER_MAX_RECOGNITION_MARKDOWN_BYTES:-33554432}
      PARSER_MAX_EXTRACTION_MARKDOWN_BYTES: ${PARSER_MAX_EXTRACTION_MARKDOWN_BYTES:-33554432}
      PARSER_MAX_EXTRACTION_BLOCKS: ${PARSER_MAX_EXTRACTION_BLOCKS:-50000}
      PARSER_MAX_EXTRACTION_LAYOUT_LINES: ${PARSER_MAX_EXTRACTION_LAYOUT_LINES:-100000}
      # shared: lightweight server; one on-demand worker per kind, each with an
      # internal thread pool (shared model/heavy imports) and idle exit.
      # worker: per-task subprocess pools; inprocess: old single gRPC process.
      PARSER_EXECUTION_MODE: ${PARSER_EXECUTION_MODE:-shared}
      PARSER_MAX_WORKERS: ${PARSER_MAX_WORKERS:-8}
      PARSER_MAX_CONCURRENT_RPCS: ${PARSER_MAX_CONCURRENT_RPCS:-8}
      # Shared mode starts one worker per kind; concurrency lives inside it.
      PARSER_RECOGNIZE_WORKER_MAX: ${PARSER_RECOGNIZE_WORKER_MAX:-1}
      PARSER_EXTRACT_WORKER_MAX: ${PARSER_EXTRACT_WORKER_MAX:-1}
      PARSER_RENDER_WORKER_MAX: ${PARSER_RENDER_WORKER_MAX:-1}
      PARSER_RECOGNIZE_CONCURRENCY: ${PARSER_RECOGNIZE_CONCURRENCY:-4}
      PARSER_EXTRACT_CONCURRENCY: ${PARSER_EXTRACT_CONCURRENCY:-4}
      PARSER_RENDER_CONCURRENCY: ${PARSER_RENDER_CONCURRENCY:-4}
      # The worker process uses 2x this value as its idle timeout.
      PARSER_WORKER_IDLE_SECONDS: ${PARSER_WORKER_IDLE_SECONDS:-120}
      PARSER_RENDER_WORKER_IDLE_SECONDS: ${PARSER_RENDER_WORKER_IDLE_SECONDS:-120}
      # Large responses fragment glibc per-thread arenas; trim them back to the
      # OS after work goes idle, and cap the number of arenas.
      PARSER_MEMORY_TRIM_SECONDS: ${PARSER_MEMORY_TRIM_SECONDS:-60}
      MALLOC_ARENA_MAX: ${PARSER_MALLOC_ARENA_MAX:-2}
      # Keep large protobuf payloads out of long-lived thread arenas and return
      # them to the OS as soon as the response is released.
      MALLOC_MMAP_THRESHOLD_: ${PARSER_MALLOC_MMAP_THRESHOLD:-131072}
      MALLOC_TRIM_THRESHOLD_: ${PARSER_MALLOC_TRIM_THRESHOLD:-131072}
      # Keep the ONNX layout engine (per-page blocks/boxes/crops). The thread
      # cap below is what keeps 4 workers from each starting a full-core pool
      # and blowing up memory; do not disable layout just for memory unless
      # blocks are expendable (false returns blocks=0).
      PARSER_PYMUPDF_LAYOUT: ${PARSER_PYMUPDF_LAYOUT:-true}
      # ONNX intra-op threads. shared/inprocess use one model/pool (core count);
      # worker mode uses cores / worker count (e.g. 4) per process.
      PARSER_LAYOUT_THREADS: ${PARSER_LAYOUT_THREADS:-16}
      PARSER_WORKER_MAX_JOBS: ${PARSER_WORKER_MAX_JOBS:-50}
      PARSER_WORKER_QUEUE_TIMEOUT: ${PARSER_WORKER_QUEUE_TIMEOUT:-30}
      PARSER_WORKER_START_TIMEOUT: ${PARSER_WORKER_START_TIMEOUT:-90}
      PARSER_RENDER_TIMEOUT: ${PARSER_RENDER_TIMEOUT:-15}
      PARSER_RENDER_MAX_DPI: ${PARSER_RENDER_MAX_DPI:-300}
      PARSER_RENDER_MAX_PIXELS: ${PARSER_RENDER_MAX_PIXELS:-20000000}
      PARSER_RENDER_MAX_OUTPUT_BYTES: ${PARSER_RENDER_MAX_OUTPUT_BYTES:-12582912}
      PARSER_RPC_MAX_SECONDS: ${PARSER_RPC_MAX_SECONDS:-900}
      PARSER_SHUTDOWN_GRACE_SECONDS: ${PARSER_SHUTDOWN_GRACE_SECONDS:-30}
      PAPER_EXTRACTION_ENGINE: ${PAPER_EXTRACTION_ENGINE:-hybrid}
      # Reference entries stay rule-owned unless this is explicitly enabled.
      PAPER_REFERENCE_CRF_ENABLED: ${PAPER_REFERENCE_CRF_ENABLED:-false}
      # Runtime CRF code, weights, and specs are baked into the parser image at
      # /app/pdf_parser/paper_crf. Override PAPER_CRF_MODEL_DIR only to test an
      # unreleased bundle mounted into the container.
    volumes:
      - ./data/uploads:/data/uploads:ro
      - ./data/recognition-output:/data/recognition-output
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    mem_limit: ${PARSER_MEM_LIMIT:-4g}
    memswap_limit: ${PARSER_MEM_LIMIT:-4g}
    cpus: ${PARSER_CPUS:-16}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Must exceed PARSER_SHUTDOWN_GRACE_SECONDS so Docker does not SIGKILL an
    # in-flight recognition before server.stop(grace) finishes.
    stop_grace_period: 40s
    depends_on:
      upload-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1', 50051), 2).close()\""]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        # Prefer explicit HTTP(S)_PROXY. In WSL/Docker Desktop setups that
        # only export ALL_PROXY, use it rather than a stale ~/.docker proxy.
        HTTP_PROXY: ${HTTP_PROXY:-${ALL_PROXY:-}}
        HTTPS_PROXY: ${HTTPS_PROXY:-${ALL_PROXY:-}}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    environment:
      DATABASE_URL: postgres://papers:papers@postgres:5432/papers?sslmode=disable
      UPLOAD_DIR: /data/uploads

      RECOGNITION_OUTPUT_DIR: /data/recognition-output
      HTTP_ADDR: :8080
      PARSER_GRPC_ADDR: parser:50051
      # Docker may pass the developer host's HTTP(S) proxy into the API
      # container. Keep outbound provider traffic proxy-capable, but never
      # proxy Compose-internal gRPC/Redis/Postgres connections: an HTTP proxy
      # cannot speak the parser's h2c gRPC protocol and fails as EOF.
      NO_PROXY: localhost,127.0.0.1,parser,postgres,redis
      no_proxy: localhost,127.0.0.1,parser,postgres,redis

      DOCUMENT_RECOGNITION_DRIVER: builtin
      REDIS_ADDR: redis:6379
      ASYNQ_CONCURRENCY: ${ASYNQ_CONCURRENCY:-32}
      DOCUMENT_RECOGNITION_CONCURRENCY: ${DOCUMENT_RECOGNITION_CONCURRENCY:-4}
      DOCUMENT_EXTRACTION_CONCURRENCY: ${DOCUMENT_EXTRACTION_CONCURRENCY:-4}
      FILE_MAX_UPLOAD_SIZE: ${FILE_MAX_UPLOAD_SIZE:-104857600}
      ASYNQ_SHUTDOWN_TIMEOUT: ${ASYNQ_SHUTDOWN_TIMEOUT:-30s}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-5m}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-10m}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-2m}
      HTTP_SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT:-30s}
      HTTP_MAX_JSON_BYTES: ${HTTP_MAX_JSON_BYTES:-1048576}
      HTTP_WRITE_RATE_PER_MINUTE: ${HTTP_WRITE_RATE_PER_MINUTE:-300}
      HTTP_WRITE_RATE_BURST: ${HTTP_WRITE_RATE_BURST:-60}
      HTTP_UPLOAD_CONCURRENCY: ${HTTP_UPLOAD_CONCURRENCY:-4}
      HTTP_BATCH_CONCURRENCY: ${HTTP_BATCH_CONCURRENCY:-2}
      HTTP_TRUSTED_PROXIES: ${HTTP_TRUSTED_PROXIES:-}
      BATCH_IMPORT_TIMEOUT: ${BATCH_IMPORT_TIMEOUT:-2m}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-48}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-24}
      DB_STATEMENT_TIMEOUT: ${DB_STATEMENT_TIMEOUT:-30s}
      CORS_ORIGIN: http://localhost:5173
      # Docker publishes MCP on loopback below. The container listener must
      # bind 0.0.0.0 for the forwarding to work. MCP_TOKEN is optional: when
      # set it is required on every request, when empty authentication is
      # disabled (see docs/mcp/agent-installation.md).
      MCP_ENABLED: ${MCP_ENABLED:-false}
      MCP_ADDR: ${MCP_ADDR:-127.0.0.1:8090}
      MCP_TOKEN: ${MCP_TOKEN:-}
      MCP_MAX_REQUEST_BYTES: ${MCP_MAX_REQUEST_BYTES:-8388608}
      MCP_MAX_IMAGE_BYTES: ${MCP_MAX_IMAGE_BYTES:-12582912}
      MCP_IMPORT_CONCURRENCY: ${MCP_IMPORT_CONCURRENCY:-20}
      MCP_LOCAL_IMPORT_ROOT: ${MCP_LOCAL_IMPORT_ROOT:-}
      PAPER_CATALOG_PROVIDERS: ${PAPER_CATALOG_PROVIDERS:-arxiv,semantic_scholar,openalex,crossref}
      PAPER_CATALOG_TIMEOUT: ${PAPER_CATALOG_TIMEOUT:-10s}
      PAPER_CATALOG_CONCURRENCY: ${PAPER_CATALOG_CONCURRENCY:-4}
      PAPER_CATALOG_ARXIV_TIMEOUT: ${PAPER_CATALOG_ARXIV_TIMEOUT:-20s}
      PAPER_CATALOG_ARXIV_SPACING: ${PAPER_CATALOG_ARXIV_SPACING:-3s}
      PAPER_CATALOG_ARXIV_CONCURRENCY: ${PAPER_CATALOG_ARXIV_CONCURRENCY:-1}
      PAPER_CATALOG_SEMANTIC_SCHOLAR_TIMEOUT: ${PAPER_CATALOG_SEMANTIC_SCHOLAR_TIMEOUT:-10s}
      PAPER_CATALOG_SEMANTIC_SCHOLAR_SPACING: ${PAPER_CATALOG_SEMANTIC_SCHOLAR_SPACING:-1s}
      PAPER_CATALOG_SEMANTIC_SCHOLAR_CONCURRENCY: ${PAPER_CATALOG_SEMANTIC_SCHOLAR_CONCURRENCY:-1}
      PAPER_CATALOG_OPENALEX_TIMEOUT: ${PAPER_CATALOG_OPENALEX_TIMEOUT:-10s}
      PAPER_CATALOG_OPENALEX_SPACING: ${PAPER_CATALOG_OPENALEX_SPACING:-1s}
      PAPER_CATALOG_OPENALEX_CONCURRENCY: ${PAPER_CATALOG_OPENALEX_CONCURRENCY:-1}
      PAPER_CATALOG_CROSSREF_TIMEOUT: ${PAPER_CATALOG_CROSSREF_TIMEOUT:-10s}
      PAPER_CATALOG_CROSSREF_SPACING: ${PAPER_CATALOG_CROSSREF_SPACING:-500ms}
      PAPER_CATALOG_CROSSREF_CONCURRENCY: ${PAPER_CATALOG_CROSSREF_CONCURRENCY:-1}
      PAPER_REFERENCE_CATALOG_MAX_PER_DOCUMENT: ${PAPER_REFERENCE_CATALOG_MAX_PER_DOCUMENT:-25}
      PAPER_REFERENCE_CATALOG_CONCURRENCY: ${PAPER_REFERENCE_CATALOG_CONCURRENCY:-2}
      PAPER_REFERENCE_CATALOG_PER_DOCUMENT_CONCURRENCY: ${PAPER_REFERENCE_CATALOG_PER_DOCUMENT_CONCURRENCY:-1}
      PAPER_REFERENCE_AUTO_RESOLVE: ${PAPER_REFERENCE_AUTO_RESOLVE:-false}
      PAPER_CATALOG_USER_AGENT: ${PAPER_CATALOG_USER_AGENT:-papersManager/1.0}
      PAPER_EXTRACTION_TASK_TIMEOUT: ${PAPER_EXTRACTION_TASK_TIMEOUT:-2m}
      PAPER_EXTRACTION_TASK_MAX_RETRY: ${PAPER_EXTRACTION_TASK_MAX_RETRY:-3}
      PAPER_CATALOG_TASK_TIMEOUT: ${PAPER_CATALOG_TASK_TIMEOUT:-10m}
      PAPER_CATALOG_TASK_MAX_RETRY: ${PAPER_CATALOG_TASK_MAX_RETRY:-5}
      PROCESSING_SPAN_RETENTION_ENABLED: ${PROCESSING_SPAN_RETENTION_ENABLED:-true}
      PROCESSING_SPAN_SUCCESS_RETENTION: ${PROCESSING_SPAN_SUCCESS_RETENTION:-720h}
      PROCESSING_SPAN_FAILURE_RETENTION: ${PROCESSING_SPAN_FAILURE_RETENTION:-2160h}
      PROCESSING_SPAN_RETENTION_BATCH: ${PROCESSING_SPAN_RETENTION_BATCH:-500}
      REMOTE_PDF_DOWNLOAD_TIMEOUT: ${REMOTE_PDF_DOWNLOAD_TIMEOUT:-2m}
      REMOTE_PDF_MAX_REDIRECTS: ${REMOTE_PDF_MAX_REDIRECTS:-5}
      REMOTE_PDF_DOWNLOAD_CONCURRENCY: ${REMOTE_PDF_DOWNLOAD_CONCURRENCY:-2}
      REMOTE_PDF_HOST_CONCURRENCY: ${REMOTE_PDF_HOST_CONCURRENCY:-1}
      REMOTE_PDF_HOST_SPACING: ${REMOTE_PDF_HOST_SPACING:-1s}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      CROSSREF_MAILTO: ${CROSSREF_MAILTO:-}
    volumes:
      - ./data/uploads:/data/uploads
      - ./data/recognition-output:/data/recognition-output
      # The runtime image is FROM scratch, so it has no writable /tmp. Go's
      # multipart parser spills bodies over 32 MiB to disk; without this mount
      # large batch uploads fail with "invalid multipart batch upload".
      - ./data/api-tmp:/tmp
    mem_limit: ${API_MEM_LIMIT:-1g}
    memswap_limit: ${API_MEM_LIMIT:-1g}
    cpus: ${API_CPUS:-4}
    depends_on:
      postgres:
        condition: service_healthy
      parser:
        condition: service_healthy

      redis:
        condition: service_healthy
      upload-permissions:
        condition: service_completed_successfully
    ports:
      - "${API_HOST_PORT:-8080}:8080"
      - "127.0.0.1:${MCP_HOST_PORT:-8090}:8090"
    # HTTP drain + Asynq drain can each take up to 30s.
    stop_grace_period: 70s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-${ALL_PROXY:-}}
        HTTPS_PROXY: ${HTTPS_PROXY:-${ALL_PROXY:-}}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    mem_limit: ${WEB_MEM_LIMIT:-256m}
    memswap_limit: ${WEB_MEM_LIMIT:-256m}
    depends_on:
      - api
    ports:
      - "${WEB_HOST_PORT:-5173}:80"
volumes:
  postgres-data:
  redis-data:
